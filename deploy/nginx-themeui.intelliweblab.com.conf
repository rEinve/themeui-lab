server {
    listen 80;
    listen [::]:80;
    server_name themeui.intelliweblab.com;

    return 301 https://themeui.intelliweblab.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name themeui.intelliweblab.com;

    ssl_certificate     /etc/ssl/cloudflare/intelliweblab.pem;
    ssl_certificate_key /etc/ssl/cloudflare/intelliweblab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    include snippets/cloudflare-realip.conf;

    root /var/www/themeui.intelliweblab.com/current;
    index index.html;

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
